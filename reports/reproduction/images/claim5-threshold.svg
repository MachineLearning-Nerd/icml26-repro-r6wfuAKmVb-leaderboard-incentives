<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440">
  <rect width="960" height="440" fill="#fbfaf7"/>
  <text x="48" y="48" font-family="sans-serif" font-size="24" font-weight="700" fill="#17202a">Claim 5: an admitted scaling family never stabilizes</text>
  <g transform="translate(90,84)">
    <line x1="0" y1="285" x2="760" y2="285" stroke="#17202a" stroke-width="2"/>
    <line x1="0" y1="285" x2="0" y2="15" stroke="#17202a" stroke-width="2"/>
    <text x="720" y="305" font-family="sans-serif" font-size="15">TbT Δ</text>
    <text x="-12" y="10" font-family="sans-serif" font-size="15">required catch-up effort</text>
    <line x1="0" y1="205" x2="740" y2="205" stroke="#a40e4c" stroke-width="6"/>
    <text x="535" y="190" font-family="sans-serif" font-size="14" fill="#a40e4c">witness: e_req(Δ)=1</text>
    <line x1="0" y1="205" x2="650" y2="45" stroke="#238636" stroke-width="5"/>
    <text x="450" y="93" font-family="sans-serif" font-size="14" fill="#238636">control: e_req(Δ)=1+Δ</text>
