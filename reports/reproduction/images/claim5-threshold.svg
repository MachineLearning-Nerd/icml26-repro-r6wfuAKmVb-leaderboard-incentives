    <text x="560" y="116" font-family="sans-serif" font-size="14" fill="#52606d">reward gap = 2</text>
    <circle cx="325" cy="125" r="7" fill="#238636"/>
    <text x="325" y="315" text-anchor="middle" font-family="sans-serif" font-size="14">control stabilizes</text>
    <text x="325" y="334" text-anchor="middle" font-family="sans-serif" font-size="14">at Δ=1</text>
  </g>
